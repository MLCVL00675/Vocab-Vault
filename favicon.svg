<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#vaultBg)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Vocabulary Book Icon -->
  <g filter="url(#shadow)">
    <!-- Book Back Cover -->
    <path d="M16 14h28a4 4 0 0 1 4 4v30a2 2 0 0 1-2 2H18a4 4 0 0 1-4-4V16a2 2 0 0 1 2-2z" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Spine Accent -->
    <path d="M14 16a2 2 0 0 1 2-2h4v36h-4a4 4 0 0 1-2-2V16z" fill="#e0e7ff" />
    
    <!-- Book Bookmark Ribbon -->
    <path d="M26 14v16l4-3 4 3V14z" fill="#4f46e5" />
    
    <!-- Text Lines on Page -->
    <rect x="24" y="34" width="18" height="2.5" rx="1.25" fill="#6366f1" />
    <rect x="24" y="39.5" width="13" height="2.5" rx="1.25" fill="#a5b4fc" />
    <rect x="24" y="45" width="16" height="2" rx="1" fill="#cbd5e1" />
  </g>
  
  <!-- Golden AI Sparkle in Top Right -->
  <path d="M46 12l1.6 3.8L51.4 17.4l-3.8 1.6L46 22.8l-1.6-3.8-3.8-1.6 3.8-1.6z" fill="url(#sparkleGrad)" filter="url(#shadow)" />
</svg>
